services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: mersin_dilek_oneri
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:1234@db:5432/mersin_dilek_oneri?schema=public"
      JWT_SECRET: "${JWT_SECRET:-a3f7b2c9e1d4f6a8b5c0e2d7f9a1b3c6e8d2f4a7b0c3e5d9f1a4b7c2e6d8f0a3}"
      APP_URL: "http://localhost:3000"
      SEED_ADMIN_PASSWORD: "admin1234"
      EMAIL_PROVIDER: "log"
      CAPTCHA_PROVIDER: "mock"
      IDENTITY_VERIFICATION_PROVIDER: "mock"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
